<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Era Online</title>
    <base href="/" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #fff; font-family: Verdana, Arial, sans-serif; display: flex; justify-content: center; padding-top: 10px; }

        /* Game frame: 800x600 matching the original VB6 form */
        #game-frame {
            width: 800px; height: 600px;
            position: relative;
            overflow: hidden;
        }

        /* --- Interface chrome (interface.JPG) --- */
        #interface-bg {
            position: absolute; top: 0; left: 0;
            width: 800px; height: 449px;
            background: url('/ui/interface.jpg') no-repeat;
            background-size: 800px 449px;
            pointer-events: none;
            z-index: 10;
        }

        /* --- Game viewport canvas --- */
        /* VB6: MainViewShp at 80,80 - 640x352 (20x11 tiles at 32px) */
        /* Canvas renders above the interface chrome - it covers the black
           viewport rectangle in interface.JPG exactly */
        #game-viewport {
            position: absolute;
            left: 80px; top: 80px;
            width: 640px; height: 352px;
            image-rendering: pixelated;
            z-index: 12;
        }

        /* --- FPS counter --- */
        #fps {
            position: absolute;
            top: 84px; right: 86px;
            color: #ff0; font-size: 11px; font-family: monospace;
            text-shadow: 1px 1px 0 #000;
            z-index: 15;
            pointer-events: none;
        }

        /* --- Stat bars (left of viewport) --- */
        /* VB6: HPShp red at 16,88 11x150, STAShp blue at 32,88, MANShp yellow at 48,88 */
        .stat-bar {
            position: absolute;
            width: 11px;
            bottom: 0;
            z-index: 15;
        }
        #hp-bar-container, #sta-bar-container, #man-bar-container {
            position: absolute;
            width: 11px; height: 150px;
            top: 88px;
            z-index: 14;
        }
        #hp-bar-container { left: 16px; }
        #sta-bar-container { left: 32px; }
        #man-bar-container { left: 48px; }
        #hp-bar { background: #ff0000; }
        #sta-bar { background: #0000ff; }
        #man-bar { background: #00ffff; }

        #stat-labels {
            position: absolute; left: 16px; top: 240px;
            font-family: 'Times New Roman', serif; font-size: 11px;
            color: #c0c0c0; z-index: 15; pointer-events: none;
        }
        #gold-label {
            position: absolute; left: 16px; top: 264px;
            font-family: 'Times New Roman', serif; font-size: 12px;
            color: #fff; z-index: 15; pointer-events: none;
        }
        #gold-value {
            position: absolute; left: 8px; top: 280px; width: 57px;
            font-family: 'Times New Roman', serif; font-size: 13px;
            color: #fff; z-index: 15; pointer-events: none; text-align: center;
        }

        /* --- Bottom panel (bottomface.JPG) --- */
        /* VB6: Image6 at -8,432 stretched to 808x169 */
        #bottom-panel {
            position: absolute;
            left: -8px; top: 432px;
            width: 808px; height: 169px;
            background: url('/ui/bottomface.jpg') no-repeat;
            background-size: 808px 169px;
            z-index: 10;
        }

        /* --- Target/info message --- */
        #target-message {
            position: absolute;
            left: 8px; top: 432px; width: 785px; height: 17px;
            font-family: 'Times New Roman', serif; font-size: 12px;
            color: #fff; text-align: center;
            z-index: 15; pointer-events: none;
            overflow: hidden; white-space: nowrap;
        }

        /* --- Chat input --- */
        /* VB6: SendTxt at 8,448 - 785x19, dark blue bg, white text */
        #chat-input {
            position: absolute;
            left: 8px; top: 449px;
            width: 785px; height: 19px;
            background: #004080; color: #fff; border: none;
            font-family: 'MS Sans Serif', 'Segoe UI', sans-serif; font-size: 11px;
            padding: 1px 4px;
            z-index: 15;
            outline: none;
        }

        /* --- Chat log --- */
        /* VB6: RecTxt at 8,472 - 785x117, dark green bg */
        #chat-log {
            position: absolute;
            left: 8px; top: 472px;
            width: 785px; height: 117px;
            background: #004000; color: #fff;
            font-family: 'MS Sans Serif', 'Segoe UI', sans-serif; font-size: 11px;
            padding: 2px 4px;
            overflow-y: scroll; overflow-x: hidden;
            z-index: 15;
        }
        #chat-log::-webkit-scrollbar { width: 12px; }
        #chat-log::-webkit-scrollbar-track { background: #002000; }
        #chat-log::-webkit-scrollbar-thumb { background: #006000; }
        .chat-talk { color: #ffffff; }
        .chat-fight { color: #ff0000; font-weight: bold; }
        .chat-warning { color: #ff0000; font-weight: bold; font-style: italic; }
        .chat-info { color: #00ff00; }
        .chat-skill { color: #0088ff; }

        /* --- Map name label --- */
        #map-name {
            position: absolute;
            right: 7px; top: 204px;
            width: 70px; height: 23px;
            font-family: 'Times New Roman', serif; font-size: 10px;
            color: #000; background: #fff; border: 1px solid #888;
            text-align: center; line-height: 23px;
            overflow: hidden; white-space: nowrap;
            z-index: 15;
        }

        /* --- Status bar at very bottom --- */
        #status-bar {
            position: absolute;
            left: 0; bottom: 0; width: 800px; height: 16px;
            font-family: monospace; font-size: 10px;
            color: #0f0; background: rgba(0,0,0,0.6);
            padding: 1px 8px;
            z-index: 15;
        }

        /* --- Pre-game overlays (intro, menu, select, login) --- */
        /* All overlay phases cover the full 800x600 game frame */
        .overlay {
            position: absolute; top: 0; left: 0;
            width: 800px; height: 600px;
            z-index: 50;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer;
        }
        .overlay.hidden { display: none; }

        /* Phase 1: Intro slideshow (VB6: intro.frm) */
        #intro-overlay { background: #000; }
        #intro-overlay img {
            max-width: 800px; max-height: 600px;
            object-fit: contain;
        }

        /* Phase 2: Main menu (VB6: Form2 - menu1.jpg) */
        #menu-overlay {
            background: url('/ui/menu.jpg') no-repeat center center;
            background-size: 800px 600px;
            cursor: default;
        }
        /* Invisible clickable hotspots over the text in menu.jpg */
        .menu-btn {
            position: absolute; cursor: pointer;
            background: transparent; border: none; color: transparent;
            font-size: 0;
        }
        #btn-enter-menath { right: 50px; top: 340px; width: 200px; height: 35px; }
        #btn-credits { right: 75px; top: 392px; width: 150px; height: 30px; }
        #btn-music-toggle { right: 55px; top: 432px; width: 185px; height: 30px; }
        #btn-menu-quit { right: 95px; top: 472px; width: 100px; height: 30px; }

        /* Phase 3: Select screen (VB6: frmSelect) */
        #select-overlay {
            background: #000;
        }
        #select-overlay img {
            width: 200px; height: 62px;
            cursor: pointer; display: block; margin: 8px 0;
        }

        /* Phase 4: Login form — small dialog over menu background (VB6: frmConnect over Form2) */
        #login-overlay {
            background: rgba(0, 0, 0, 0.85);
        }
        #login-box {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #555;
            padding: 20px 30px;
            text-align: center;
        }
        #login-box h2 {
            font-family: 'Times New Roman', serif;
            font-size: 20px; color: #ccc;
            margin-bottom: 12px; letter-spacing: 2px;
        }
        #login-box input, #login-box select {
            display: block; margin: 6px auto; padding: 5px 10px; width: 200px;
            font-family: Verdana, sans-serif; font-size: 12px;
            background: #1a1a2e; color: #eee; border: 1px solid #555;
        }
        #login-box .btn-row { margin-top: 10px; }
        #login-box button {
            margin: 4px; padding: 5px 14px; cursor: pointer;
            font-family: Verdana, sans-serif; font-size: 12px;
            background: #2a2a4e; color: #eee; border: 1px solid #666;
        }
        #login-box button:hover { background: #3a3a6e; }
        #login-error { color: #f44; font-size: 11px; margin-top: 8px; min-height: 16px; }

        /* Character creation — fullscreen menu2.jpg background (VB6: Form3/Form5/Form4 maximized) */
        #create-overlay {
            background: #000 url('/ui/menu2.jpg') center top / contain no-repeat;
        }
        #create-panel {
            position: absolute;
            /* Positioned over the parchment panel area in menu2.jpg */
            top: 32%; left: 50%; transform: translateX(-50%);
            width: 440px;
            text-align: center;
            padding: 10px 20px;
        }
        #create-panel h2 {
            font-family: 'Times New Roman', serif;
            font-size: 18px; font-weight: bold; color: #1a1a1a;
            margin-bottom: 8px; letter-spacing: 1px;
        }
        #create-panel label {
            display: block; color: #222; font-family: Verdana, sans-serif;
            font-size: 11px; margin-top: 6px; text-align: left;
            width: 230px; margin-left: auto; margin-right: auto;
        }
        #create-panel select, #create-panel input {
            display: block; margin: 4px auto; padding: 4px 8px; width: 230px;
            font-family: Verdana, sans-serif; font-size: 11px;
            background: #808080; color: #000; border: 1px solid #555;
        }
        .create-desc {
            color: #333; font-family: Verdana, sans-serif; font-size: 10px;
            margin: 4px auto; width: 340px; text-align: left; min-height: 28px;
        }
        #create-panel .btn-row { margin-top: 12px; }
        #create-panel button {
            margin: 4px; padding: 4px 18px; cursor: pointer;
            font-family: Verdana, sans-serif; font-size: 11px;
            background: #ccc; color: #000; border: 1px solid #888;
        }
        #create-panel button:hover { background: #ddd; }
        #create-error { color: #f00; font-size: 11px; margin-top: 6px; min-height: 14px; }

        /* Create character extras (hidden by default for login flow) */
        .create-fields { display: none; }
        .create-fields.active { display: block; }
        .hidden { display: none !important; }

        /* --- Character sheet panel (VB6: inventory.frm 798x425 with charsht.JPG) --- */
        #charsheet-panel {
            position: absolute; top: 40px; left: 1px;
            width: 798px; height: 425px;
            background: url('/ui/charsht.jpg') no-repeat;
            background-size: 798px 425px;
            z-index: 40;
            display: none;
            image-rendering: auto;
        }
        #charsheet-panel.visible { display: block; }

        /* VB6: ObjLst ListBox at left=528 top=176 width=161 height=82 */
        #inv-list {
            position: absolute; left: 528px; top: 176px;
            width: 161px; height: 82px;
            overflow-y: auto; overflow-x: hidden;
            font-family: 'MS Sans Serif', 'Segoe UI', sans-serif; font-size: 10px;
            color: #fff; background: rgba(0,0,0,0.3);
        }
        #inv-list::-webkit-scrollbar { width: 8px; }
        #inv-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        #inv-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); }
        .inv-item {
            padding: 1px 3px; cursor: default; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .inv-item:hover { background: rgba(255,255,255,0.15); }
        .inv-item.selected { background: rgba(100,100,200,0.4); }
        .inv-item.equipped { color: #ff0; }

        /* VB6: navn label at left=48 top=24 */
        #charsheet-name {
            position: absolute; left: 48px; top: 24px; width: 153px;
            font-family: 'Times New Roman', serif; font-size: 13px;
            color: #000;
        }
        /* VB6: status label at left=256 top=24 */
        #charsheet-class {
            position: absolute; left: 256px; top: 24px; width: 169px;
            font-family: 'Times New Roman', serif; font-size: 13px;
            color: #000;
        }
        /* VB6: RepRank label at left=360 top=104 */
        #charsheet-rep {
            position: absolute; left: 360px; top: 104px; width: 145px;
            font-family: 'Times New Roman', serif; font-size: 13px;
            color: #8e8;
        }

        /* VB6: Label6 help text at left=528 top=264 */
        #charsheet-help {
            position: absolute; left: 528px; top: 264px; width: 177px;
            font-size: 10px; color: #8e8;
        }

        /* VB6: Label1 (Close) at left=696 top=376 width=73 */
        #charsheet-close {
            position: absolute; left: 696px; top: 376px;
            width: 73px; height: 30px; cursor: pointer;
            background: transparent; border: none; color: transparent;
        }
        /* VB6: Label4 (Spellbook) at left=488 top=376 */
        #charsheet-spellbook {
            position: absolute; left: 488px; top: 376px;
            width: 65px; height: 30px; cursor: pointer;
            background: transparent; border: none; color: transparent;
        }
        /* VB6: Label3 (Skills) at left=560 top=376 */
        #charsheet-skills {
            position: absolute; left: 560px; top: 376px;
            width: 65px; height: 30px; cursor: pointer;
            background: transparent; border: none; color: transparent;
        }

        /* Right-click context menu for inventory items */
        #inv-context-menu {
            position: absolute; display: none; z-index: 45;
            background: #2a2a2a; border: 1px solid #666;
            font-family: 'MS Sans Serif', sans-serif; font-size: 11px;
            color: #eee; min-width: 100px;
        }
        #inv-context-menu div {
            padding: 4px 12px; cursor: pointer;
        }
        #inv-context-menu div:hover { background: #444; }
    </style>
</head>
<body>
    <div id="game-frame">
        <!-- Game viewport (renders underneath the chrome) -->
        <canvas id="game-viewport"></canvas>

        <!-- Interface chrome overlay -->
        <div id="interface-bg"></div>
        <div id="fps"></div>

        <!-- Stat bars -->
        <div id="hp-bar-container"><div id="hp-bar" class="stat-bar" style="height:100%"></div></div>
        <div id="sta-bar-container"><div id="sta-bar" class="stat-bar" style="height:100%"></div></div>
        <div id="man-bar-container"><div id="man-bar" class="stat-bar" style="height:100%"></div></div>
        <div id="stat-labels">H  S  M</div>
        <div id="gold-label">Gold:</div>
        <div id="gold-value">0</div>
        <div id="exp-label" style="position:absolute; left:8px; top:300px; width:57px;
            font-family:'Times New Roman',serif; font-size:11px; color:#c0c0c0;
            z-index:15; pointer-events:none; text-align:center;">EXP: 0%</div>

        <!-- Map name -->
        <div id="map-name"></div>

        <!-- Bottom panel -->
        <div id="bottom-panel"></div>
        <div id="target-message"></div>
        <input type="text" id="chat-input" maxlength="200" autocomplete="off" />
        <div id="chat-log"></div>

        <!-- Status bar -->
        <div id="status-bar"></div>

        <!-- Character sheet panel (VB6: inventory.frm) -->
        <div id="charsheet-panel">
            <div id="charsheet-name"></div>
            <div id="charsheet-class"></div>
            <div id="charsheet-rep"></div>
            <div id="inv-list"></div>
            <div id="charsheet-help">Right-click an item to use, drop, or equip it.</div>
            <button id="charsheet-close">Close</button>
            <button id="charsheet-spellbook">Spellbook</button>
            <button id="charsheet-skills">Skills</button>
        </div>

        <!-- Right-click context menu for inventory items -->
        <div id="inv-context-menu">
            <div id="ctx-use">Use / Equip</div>
            <div id="ctx-drop">Drop</div>
            <div id="ctx-unequip">Unequip</div>
        </div>

        <!-- Phase 1: Intro slideshow (VB6: intro.frm) -->
        <div id="intro-overlay" class="overlay">
            <img id="intro-img" src="/ui/intro/1.jpg" alt="" />
        </div>

        <!-- Phase 2: Main menu (VB6: Form2 - menu1.jpg with ENTER MENATH etc.) -->
        <div id="menu-overlay" class="overlay hidden">
            <button id="btn-enter-menath" class="menu-btn">Enter Menath</button>
            <button id="btn-credits" class="menu-btn">Credits</button>
            <button id="btn-music-toggle" class="menu-btn">Music On/Off</button>
            <button id="btn-menu-quit" class="menu-btn">Quit</button>
        </div>

        <!-- Phase 3: Select screen (VB6: frmSelect) -->
        <div id="select-overlay" class="overlay hidden">
            <img id="btn-select-login" src="/ui/loginto.jpg" alt="Log into character"
                 onmouseover="this.src='/ui/loginto2.jpg'" onmouseout="this.src='/ui/loginto.jpg'" />
            <img id="btn-select-create" src="/ui/startnew.jpg" alt="Start new character"
                 onmouseover="this.src='/ui/startnew2.jpg'" onmouseout="this.src='/ui/startnew.jpg'" />
        </div>

        <!-- Login form — small dialog over menu (VB6: frmConnect over Form2) -->
        <div id="login-overlay" class="overlay hidden">
            <div id="login-box">
                <h2 id="login-title">Log Into Character</h2>
                <input type="text" id="login-name" placeholder="Character name" maxlength="20" />
                <input type="password" id="login-pass" placeholder="Password" />
                <div class="btn-row">
                    <button id="btn-login">Enter Menath</button>
                </div>
                <div id="login-error"></div>
            </div>
        </div>

        <!-- Character creation — fullscreen with menu2.jpg (VB6: Form3/Form5/Form4) -->
        <div id="create-overlay" class="overlay hidden">
            <div id="create-panel">
                <h2>-Character Creation</h2>
                <!-- Step 0: Name + Password -->
                <div id="create-step-name">
                    <input type="text" id="create-name" placeholder="Character name" maxlength="20" />
                    <input type="password" id="create-pass" placeholder="Password" />
                </div>
                <!-- Step 1: Race (VB6: Form3) -->
                <div id="create-step-race">
                    <label>Race:</label>
                    <select id="create-race">
                        <option value="">-- Select Race --</option>
                        <option value="Human">Human</option>
                        <option value="Haaki">Haaki</option>
                        <option value="Wood Elf">Wood Elf</option>
                        <option value="Dark Elf">Dark Elf</option>
                    </select>
                    <div id="race-desc" class="create-desc"></div>
                </div>
                <!-- Step 2: Class + Specialized Skills (VB6: Form5) -->
                <div id="create-step-class" class="hidden">
                    <label>Class:</label>
                    <select id="create-class">
                        <option value="">-- Select Class --</option>
                    </select>
                    <div id="class-desc" class="create-desc"></div>
                    <label>Specialized Skill 1:</label>
                    <select id="create-spec1"></select>
                    <label>Specialized Skill 2:</label>
                    <select id="create-spec2"></select>
                    <label>Specialized Skill 3:</label>
                    <select id="create-spec3"></select>
                    <div class="create-desc">Only specialized skills may surpass 50 points. You can have three.</div>
                </div>
                <!-- Step 3: Gender (VB6: Form4) -->
                <div id="create-step-gender" class="hidden">
                    <label>Gender:</label>
                    <select id="create-gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div class="btn-row">
                    <button id="btn-create-back" class="hidden">Back</button>
                    <button id="btn-create-next">Continue</button>
                </div>
                <div id="create-error"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/client.js"></script>
</body>
</html>
