<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Era Online</title>
    <base href="/" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #003369; color: #fff; font-family: Verdana, Arial, sans-serif; }
        #app { display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        h1 { font-size: 18px; margin-bottom: 10px; color: #ccc; letter-spacing: 2px; }
        #game-viewport { border: 2px solid #444; image-rendering: pixelated; background: #000; }
        #loading { color: #0f0; font-size: 11px; margin-top: 8px; font-family: monospace; }
        #fps { color: #ff0; font-size: 11px; font-family: monospace; position: absolute; top: 4px; right: 6px; text-shadow: 1px 1px 0 #000; pointer-events: none; }

        /* Login form */
        #login-screen { text-align: center; }
        #login-screen input, #login-screen select {
            display: block; margin: 4px auto; padding: 6px 10px; width: 200px;
            font-family: Verdana, sans-serif; font-size: 12px;
            background: #1a1a2e; color: #eee; border: 1px solid #555;
        }
        #login-screen button {
            margin: 8px 4px; padding: 6px 16px; cursor: pointer;
            font-family: Verdana, sans-serif; font-size: 12px;
            background: #2a2a4e; color: #eee; border: 1px solid #666;
        }
        #login-screen button:hover { background: #3a3a6e; }
        #login-error { color: #f44; font-size: 11px; margin-top: 6px; min-height: 16px; }
        #login-screen .toggle { color: #88f; font-size: 11px; cursor: pointer; text-decoration: underline; margin-top: 8px; }

        #game-screen { display: none; }
    </style>
</head>
<body>
    <div id="app">
        <h1>ERA ONLINE</h1>

        <div id="login-screen">
            <div id="login-form">
                <input type="text" id="login-name" placeholder="Character name" maxlength="20" />
                <input type="password" id="login-pass" placeholder="Password" />
                <button id="btn-login">Enter Menath</button>
                <div class="toggle" id="show-create">Create new character</div>
            </div>
            <div id="create-form" style="display:none;">
                <input type="text" id="create-name" placeholder="Character name" maxlength="20" />
                <input type="password" id="create-pass" placeholder="Password" />
                <select id="create-race">
                    <option value="Human">Human</option>
                    <option value="Haaki">Haaki</option>
                    <option value="Wood Elf">Wood Elf</option>
                    <option value="Dark Elf">Dark Elf</option>
                </select>
                <select id="create-gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
                <button id="btn-create">Create Character</button>
                <div class="toggle" id="show-login">Back to login</div>
            </div>
            <div id="login-error"></div>
        </div>

        <div id="game-screen">
            <div style="position: relative; display: inline-block;">
                <canvas id="game-viewport"></canvas>
                <div id="fps"></div>
            </div>
            <div id="loading"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/client.js"></script>
</body>
</html>
