<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Era Online</title>
    <base href="/" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #003369; color: #fff; font-family: Verdana, Arial, sans-serif; }
        #app { display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        h1 { font-size: 18px; margin-bottom: 10px; color: #ccc; letter-spacing: 2px; }
        #game-viewport { border: 2px solid #444; image-rendering: pixelated; background: #000; position: relative; }
        #loading { color: #0f0; font-size: 11px; margin-top: 8px; font-family: monospace; }
        #fps { color: #ff0; font-size: 11px; font-family: monospace; position: absolute; top: 4px; right: 6px; text-shadow: 1px 1px 0 #000; pointer-events: none; }
    </style>
</head>
<body>
    <div id="app">
        <h1>ERA ONLINE</h1>
        <div style="position: relative; display: inline-block;">
            <canvas id="game-viewport"></canvas>
            <div id="fps"></div>
        </div>
        <div id="loading">Loading...</div>
    </div>

    <script src="js/renderer.js"></script>
    <script>
        EraRenderer.init('game-viewport', '/data');
    </script>
</body>
</html>
